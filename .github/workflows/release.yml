name: Release browser extension

# Builds the MV3 browser extension and attaches a ready-to-load / ready-to-upload
# ZIP to a GitHub Release. Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Web Store keys a submission by the manifest's version and rejects one it has already
      # seen, so a tag that disagrees with the manifest produces a ZIP that cannot be uploaded
      # under the name it carries. Fail here instead, where it is one line to fix.
      - name: Check the tag against the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version extension/src/jsMain/resources/manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match manifest version $MANIFEST" >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production extension bundle
        env:
          STRAMUS_SERVER_URL: ${{ vars.STRAMUS_SERVER_URL }}
          # Optional: a fork's own OAuth client. Unset means the published one, baked into
          # :ui-shared:generateBuildDefaults.
          STRAMUS_GOOGLE_CLIENT_ID: ${{ vars.STRAMUS_GOOGLE_CLIENT_ID }}
        run: ./gradlew :extension:jsBrowserDistribution --no-daemon

      # Package the loadable extension directory. Source maps are dropped to keep the
      # artifact lean and Web-Store-friendly; the manifest + bundle + wasm are kept.
      # Manual runs (workflow_dispatch) have no tag to read a version from, so the
      # manifest is the source of truth there; tag pushes already validated the two agree.
      - name: Package extension ZIP
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(jq -r .version extension/src/jsMain/resources/manifest.json)
          fi
          OUT="stramus-extension-${VERSION}.zip"
          echo "ZIP=$OUT" >> "$GITHUB_ENV"
          cd extension/build/dist/js/productionExecutable
          # The manifest names its strings out of _locales; without them Chrome refuses to load the
          # extension at all ("Localization used, but default_locale wasn't specified"). Resources
          # are copied by the build, so their absence would mean the build changed under us.
          for required in manifest.json _locales/en/messages.json _locales/ru/messages.json; do
            [ -f "$required" ] || { echo "Missing from the bundle: $required" >&2; exit 1; }
          done
          zip -r "$GITHUB_WORKSPACE/$OUT" . -x '*.map' -x '*.LICENSE.txt'

      # GitHub Releases require a tag, which a manual run doesn't have — upload the
      # ZIP as a workflow artifact instead so the build stays inspectable/downloadable.
      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Uploads the ZIP as a new item version in the Web Store. The upload API alone leaves
      # it sitting as a draft pending review/publish — it does not call the separate
      # publish endpoint — which is exactly the "draft" behavior wanted here.
      - name: Publish to Chrome Web Store (draft)
        if: github.ref_type == 'tag'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CHROME_CLIENT_ID" \
            -d client_secret="$CHROME_CLIENT_SECRET" \
            -d refresh_token="$CHROME_REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain a Chrome Web Store access token:" >&2
            echo "$TOKEN_RESPONSE" >&2
            exit 1
          fi

          UPLOAD_RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID")
          echo "$UPLOAD_RESPONSE"
          UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState // empty')
          if [ "$UPLOAD_STATE" != "SUCCESS" ]; then
            echo "Chrome Web Store upload failed (state: $UPLOAD_STATE)" >&2
            exit 1
          fi
