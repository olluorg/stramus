name: CI

# Build check for pull requests and pushes to main. Compiles every module and
# assembles both production bundles so a broken build is caught before release/deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :webapp:jsBrowserDistribution :extension:jsBrowserDistribution --no-daemon
