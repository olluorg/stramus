name: CI

# Build check for pull requests and pushes to main. Compiles every module and
# assembles both production bundles so a broken build is caught before release/deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, because it is a second long and needs no JDK: the version in two files that disagree,
      # a locale missing a key the manifest names, a listing still describing the previous release, a
      # screenshot that is no longer 1280x800. None of that needs a build to notice, and all of it is
      # invisible until after a release has gone out. See tools/README.md.
      - name: Consistency checks
        run: python3 tools/preflight.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        # The server and the shared core carry the whole of the sync logic, and it is the kind of logic that
        # fails quietly — a merge that drops a version, a code that can be guessed. It is checked here before
        # anything is assembled.
        #
        # `:core:jsNodeTest` is in the list because the store, the sync engine and the import only exist on
        # the JS side: kidx is a layer over IndexedDB, so the code that decides whether a row already exists
        # — which is the code that either prevents duplicates or makes them — cannot be run on the JVM at
        # all. It runs here under fake-indexeddb, the way kidx tests itself. Left out, the half of the app
        # most likely to go quietly wrong was the half nothing checked.
        #
        # `-PliveSync` starts the real server and points `LiveServerTest` at it, so the real client —
        # the same engine and the same HTTP client the browser runs — talks to the real Ktor server over
        # a real socket. Everything else tests one half against a stand-in for the other, and a stand-in
        # can only ever agree with whoever wrote it.
        run: ./gradlew :core:jvmTest :core:jsNodeTest :server:test -PliveSync --no-daemon

      - name: Assemble
        run: ./gradlew :webapp:jsBrowserDistribution :extension:jsBrowserDistribution --no-daemon
