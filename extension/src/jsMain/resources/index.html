<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stramus</title>
    <link rel="icon" type="image/png" sizes="32x32" href="logo-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo-16.png">
    <link rel="apple-touch-icon" sizes="128x128" href="logo-128.png">
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --border: #e6e8eb;
            --text: #1c2024;
            --muted: #6b7280;
            --accent: #3b82f6;
            --accent-soft: #eaf1fe;
            --danger: #ef4444;
        }
        /* Dark palette, shared by the OS "auto" default and the explicit night theme. */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16181d;
                --panel: #1e2127;
                --border: #2b2f36;
                --text: #e7e9ea;
                --muted: #9aa1ab;
                --accent: #4b8bf5;
                --accent-soft: #22304d;
                --danger: #f26060;
            }
        }
        /* Explicit theme choice from the toolbar wins over the OS preference. */
        :root[data-theme="dark"] {
            --bg: #16181d;
            --panel: #1e2127;
            --border: #2b2f36;
            --text: #e7e9ea;
            --muted: #9aa1ab;
            --accent: #4b8bf5;
            --accent-soft: #22304d;
            --danger: #f26060;
        }
        :root[data-theme="light"] {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --border: #e6e8eb;
            --text: #1c2024;
            --muted: #6b7280;
            --accent: #3b82f6;
            --accent-soft: #eaf1fe;
            --danger: #ef4444;
        }
        /* Accent-color presets (Settings → Appearance). Blue is the base palette above and needs no
           override here. Each preset repeats the same shape the theme itself uses just above: a bare
           base for the light/OS-default case, a dark-OS media query, and the two explicit `data-theme`
           cases — so a preset wins over the theme's own accent no matter which of the four applies. */
        :root[data-accent="purple"] { --accent: #8b5cf6; --accent-soft: #f1ecfe; }
        @media (prefers-color-scheme: dark) {
            :root[data-accent="purple"]:not([data-theme="light"]) { --accent: #a78bfa; --accent-soft: #2e2650; }
        }
        :root[data-theme="dark"][data-accent="purple"] { --accent: #a78bfa; --accent-soft: #2e2650; }
        :root[data-theme="light"][data-accent="purple"] { --accent: #8b5cf6; --accent-soft: #f1ecfe; }

        :root[data-accent="green"] { --accent: #16a34a; --accent-soft: #e7f7ed; }
        @media (prefers-color-scheme: dark) {
            :root[data-accent="green"]:not([data-theme="light"]) { --accent: #4ade80; --accent-soft: #16321f; }
        }
        :root[data-theme="dark"][data-accent="green"] { --accent: #4ade80; --accent-soft: #16321f; }
        :root[data-theme="light"][data-accent="green"] { --accent: #16a34a; --accent-soft: #e7f7ed; }

        :root[data-accent="orange"] { --accent: #ea580c; --accent-soft: #fdece0; }
        @media (prefers-color-scheme: dark) {
            :root[data-accent="orange"]:not([data-theme="light"]) { --accent: #fb923c; --accent-soft: #3a2b12; }
        }
        :root[data-theme="dark"][data-accent="orange"] { --accent: #fb923c; --accent-soft: #3a2b12; }
        :root[data-theme="light"][data-accent="orange"] { --accent: #ea580c; --accent-soft: #fdece0; }

        :root[data-accent="rose"] { --accent: #e11d48; --accent-soft: #fce7ec; }
        @media (prefers-color-scheme: dark) {
            :root[data-accent="rose"]:not([data-theme="light"]) { --accent: #fb7185; --accent-soft: #3a1f28; }
        }
        :root[data-theme="dark"][data-accent="rose"] { --accent: #fb7185; --accent-soft: #3a1f28; }
        :root[data-theme="light"][data-accent="rose"] { --accent: #e11d48; --accent-soft: #fce7ec; }
        * { box-sizing: border-box; }
        /* Rows that stand in for a button (a collection, an open tab, a card, a collapsible title) are
           focusable so the keyboard can reach them, but native `<button>`/`<a>` elsewhere already have
           their own browser-drawn focus ring — this ring is only for those stand-ins, and only for
           keyboard focus (:focus-visible), so clicking one does not draw a ring a mouse user never asked
           to see. */
        .col:focus-visible, .tab:focus-visible, .card:focus-visible,
        .section-title:focus-visible, .card-section-title:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }
        html, body { margin: 0; height: 100%; }
        body {
            font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        #root, .app { height: 100vh; }
        .app { display: flex; }
        /* Settings: sections sidebar and tabs/history sidebar swap sides. Reversing the row keeps the
           content pane in the middle without touching either sidebar's own markup. */
        .app.swapped { flex-direction: row-reverse; }
        .app.swapped .sidebar { border-right: none; border-left: 1px solid var(--border); }
        .app.swapped .tabs { border-left: none; border-right: 1px solid var(--border); }
        /* The collapse button always sits on the edge nearest the content pane, never the edge nearest
           the window — regardless of which physical side each sidebar is anchored to. The tabs sidebar
           is right-anchored by default, so its header starts reversed; swapping either sidebar over to
           the opposite edge flips its header to match. */
        .tabs .tabs-head { flex-direction: row-reverse; }
        .app.swapped .tabs .tabs-head { flex-direction: row; }
        .app.swapped .sidebar .brand { flex-direction: row-reverse; }

        .sidebar {
            width: 260px;
            flex: 0 0 260px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            gap: 10px;
            overflow-y: auto;
        }
        .brand { font-size: 18px; font-weight: 700; padding: 4px 8px; letter-spacing: 0.2px; }

        /* Every non-text glyph in the app — what used to be a bare emoji or dingbat character — is an
           inline SVG wrapped in one of these (see `icon()` in Icon.kt). It is sized to the font-size of
           whatever it sits in, so every .icon/.chevron/.glyph/etc rule below that already sets a
           font-size for the character it used to hold keeps controlling the icon's size unchanged. */
        .icon-glyph {
            display: inline-flex; align-items: center; justify-content: center;
            width: 1em; height: 1em; line-height: 0; vertical-align: -0.15em; flex: none;
        }
        .icon-glyph svg { width: 100%; height: 100%; display: block; }

        .btn {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .new-col { text-align: left; }

        .sidebar > .section { display: flex; flex-direction: column; gap: 2px; }
        .section-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px 2px; }
        .section-title { flex: 1; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .section-head .icon { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
        /* The tools of a section — add a collection, delete it — stay out of the way until it is hovered,
           or until one is reached by keyboard (:focus-within covers both). */
        .section-head .icon.add { opacity: 0; }
        .section-head:hover .icon.add, .section-head:focus-within .icon.add { opacity: 1; }
        .section-head .icon:hover { color: var(--accent); }
        .section-head .icon.del:hover { color: var(--danger); }
        /* Collections are the children of their section: indented under its header and hung off a
           branch line, so the sidebar reads as a two-level tree instead of two kinds of similar row. */
        .collections { list-style: none; margin: 2px 0 4px 15px; padding: 0 0 0 9px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
        .col {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; border-radius: 8px; cursor: pointer;
        }
        .col:hover { background: var(--bg); }
        .col.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
        .col.drop-target { background: var(--accent); color: #fff; outline: 2px solid var(--accent); outline-offset: 1px; }
        .col.drop-target .icon.del { color: #fff; }
        .col-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* A read-only collection wears its padlock in the sidebar. */
        .col-lock { flex: 0 0 auto; font-size: 12px; padding: 0 2px; }
        /* The stand-in name of a section or collection with none of its own: set apart in italics so it
           reads as a placeholder, not as a real title someone typed. */
        .untitled { color: var(--muted); font-style: italic; }

        .icon.del {
            border: none; background: transparent; color: var(--muted);
            cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; opacity: 0;
        }
        .col:hover .icon.del, .card:hover .icon.del,
        .col:focus-within .icon.del, .card:focus-within .icon.del { opacity: 1; }
        /* The section's own × lives in its header, which is not a .col — without this it stays invisible. */
        .section-head:hover .icon.del, .section-head:focus-within .icon.del { opacity: 1; }
        .icon.del:hover { color: var(--danger); }

        .content { flex: 1; padding: 24px 28px; overflow-y: auto; }
        .content.drop-active { outline: 3px dashed var(--accent); outline-offset: -10px; background: var(--accent-soft); }
        .content-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .content-head h2 { margin: 0; font-size: 20px; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        /* --card-accent is the card's own colour: the kinds that carry one (see .card.kind-*) override
           it, so the stripe and the hover highlight of a note are yellow where a link's stay blue. */
        /* A link card is a real <a href> so it opens in a new tab on middle- or Ctrl/Cmd-click; the
           reset keeps it from taking the browser's blue-underline link look. */
        .card {
            --card-accent: var(--accent);
            position: relative;
            display: flex; align-items: center; gap: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            color: inherit; text-decoration: none;
            /* A resting shadow lifts the card off the page, so the grid reads as objects rather than
               as faint outlines on a flat sheet; the hover deepens it and floats the card up. */
            box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
            transition: border-color .12s, transform .12s, box-shadow .12s;
        }
        .card:hover, .card:focus-within { border-color: var(--card-accent); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(16, 24, 40, .12); }
        /* No chip behind the favicon: it sits straight on the card, so the tile is lighter and the eye
           lands on the title, not on a row of grey squares. */
        .fav { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 5px; }
        .card-body { min-width: 0; flex: 1; }
        .card-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 40px; }
        /* A card with no second line (a link whose address is hidden) gives that line to the title:
           two lines of it, and the min-height keeps the tile the same size as one that has a URL. */
        .card-title.two-line {
            white-space: normal;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
            min-height: 2.9em;
        }
        .card-url { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-tools { position: absolute; top: 6px; right: 6px; display: flex; align-items: center; gap: 2px; }
        .card:hover .icon.edit, .card:focus-within .icon.edit { opacity: 1; }
        /* On hover the tools sit over the title's tail; a chip behind each keeps them a clear target. */
        .card-tools .icon:hover { background: var(--bg); border-radius: 5px; }

        /* Right sidebar: live open-tabs list (extension only), one group per browser window */
        .tabs {
            width: 280px; flex: 0 0 280px;
            background: var(--panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 16px 12px; gap: 8px;
        }
        /* Settings: the Tabs pane shows a grid of cards instead of its list. The grid wants the room a
           card needs, so the sidebar drops its fixed width and grows to match the content pane instead —
           the two [.content, .tabs.cards-view] are then simply two equal flex:1 children of .app. */
        .tabs.cards-view { width: auto; flex: 1; }
        .tabs-head { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 4px 8px; }
        .tab-search { width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
        .tab-search:focus { outline: none; border-color: var(--accent); }
        /* The scroll lives here, so the header and the search box stay put above it. */
        .tabs-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .tab-window { border-radius: 10px; padding: 0 4px 4px; outline: 2px dashed transparent; outline-offset: -2px; transition: background .12s; }
        .tab-window.drop-active { outline-color: var(--accent); background: var(--accent-soft); }
        .tab-window-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 6px 4px; }
        .tab-window-head .count { font-weight: 500; }
        .tab-window-tools { display: flex; align-items: center; gap: 6px; }
        /* The app's own tooltip, and the only kind the app has: the browser's `title` waits about a
           second and comes in the system's colours, not ours. The controls carry the words (data-hint,
           set by `hint()` in Browser.kt); this is the one element that shows them, drawn at the root of
           the page by `HintLayer` and placed against the viewport.

           That is why it is `fixed` and lives outside the panels: a tooltip drawn inside the control it
           belongs to is drawn inside whatever scrolls that control — the tabs list, the sidebar, the
           content area — and a scroll box clips whatever leaves it, however high the z-index. The
           layer's own placement (which side of the control, above it or below) comes from HintLayer;
           everything the tooltip *looks* like is here. */
        .hint-pop {
            position: fixed; z-index: 300;
            max-width: 280px; width: max-content;
            padding: 6px 8px; border-radius: 8px;
            background: var(--text); color: var(--panel);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
            /* Its own voice: the headers it may stand over are uppercase and letter-spaced, a sentence
               is not. A URL (the history's rows carry one) has nowhere to break, so it breaks anywhere. */
            font-size: 12px; font-weight: 400; line-height: 1.35;
            text-transform: none; letter-spacing: normal; text-align: left;
            white-space: normal; overflow-wrap: anywhere;
            pointer-events: none; /* it is a label, not a thing to hit */
        }

        /* The ⇅ menu that sorts the window's tabs, and the ⤓ that saves them into the open collection.
           The select is stripped of its own chrome so that only the glyph shows, and both — like the ×
           on a tab — stay out of the way until the window is hovered or the control itself is focused.

           Both are pinned to a square: left to itself a select is as wide as its widest option, which
           here would be a sentence ("Sort by date added") behind a one-glyph button. The glyph is then
           centred in that square — text-align-last is what a select listens to, the button takes the
           plain one. */
        .tab-sort, .tab-save, .tab-triage {
            appearance: none; -webkit-appearance: none;
            box-sizing: border-box; width: 20px; height: 20px;
            border: 1px solid transparent; background: transparent; color: var(--muted);
            border-radius: 6px; padding: 0; font-size: 12px; line-height: 1;
            text-align: center; text-align-last: center;
            cursor: pointer; opacity: 0; transition: opacity .12s, color .12s;
        }
        .tab-window:hover .tab-sort, .tab-window:hover .tab-save, .tab-window:hover .tab-triage,
        .tab-sort:focus, .tab-save:focus, .tab-triage:focus { opacity: 1; }
        /* ...but the menu that drops out of it is a list of sentences, and reads from the left. */
        .tab-sort option { text-align: left; text-align-last: left; }
        .tab-sort:hover, .tab-save:hover, .tab-triage:hover { color: var(--accent); border-color: var(--border); }
        .tab-sort:focus, .tab-save:focus, .tab-triage:focus { outline: none; border-color: var(--accent); }
        .tab-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
        .tab {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 8px; cursor: pointer;
            border: 1px solid transparent;
        }
        /* One hover language across every list row — a tab here, a collection in the sidebar, a search
           hit: the pointer lands the same way in all three panels, so they read as one surface. */
        .tab:hover { background: var(--bg); }
        .tab:active { cursor: grabbing; }
        /* The tab selected in its window, the one dragged, and the one a drag would land on. The
           current tab wears the same accent-soft + accent-text mark as the open collection does in the
           sidebar (.col.selected), so "you are here" looks identical on both sides of the page. */
        .tab.current { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
        .tab.dragging { opacity: .4; }
        .tab.drop-target { outline: 2px solid var(--accent); outline-offset: -1px; }
        .tab .fav { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 4px; }
        .tab-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .tab:hover .icon.del, .tab:focus-within .icon.del { opacity: 1; }
        .empty.small { padding: 16px 8px; font-size: 13px; text-align: left; }

        /* The right sidebar's pane switch: the open tabs, or the browsing history */
        .pane-switch { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
        .pane-tab { border: none; background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        .pane-tab:hover { color: var(--text); }
        .pane-tab.active { background: var(--panel); color: var(--text); }
        /* A history row is a tab row plus the time of the visit: same look, same drag, no drop target. */
        .history-time { color: var(--muted); font-size: 11px; flex: 0 0 auto; }

        /* Brand row + sidebar collapse controls */
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 5px; }
        .brand-name { flex: 1; min-width: 0; color: #50219B; }
        .icon.collapse-btn { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; opacity: .7; }
        .icon.collapse-btn:hover { color: var(--accent); opacity: 1; }
        /* The Tabs pane's quick list/cards switch, beside the collapse button — the same choice as the
           `tabsCardView` setting, without a trip to Settings. */
        .icon.view-toggle { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; opacity: .7; }
        .icon.view-toggle:hover { color: var(--accent); opacity: 1; }
        .sidebar.collapsed, .tabs.collapsed { width: 40px; flex: 0 0 40px; padding: 12px 5px; align-items: center; }
        .rail-toggle { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 8px; cursor: pointer; padding: 8px 4px; width: 100%; }
        .rail-toggle:hover { color: var(--accent); border-color: var(--accent); }
        /* The collapsed sidebar's miniature tree: one square per section, one per collection under it. */
        .rail-tree { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 4px; }
        .rail-section { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding-top: 8px; border-top: 1px solid var(--border); }
        .rail-section:first-child { padding-top: 0; border-top: none; }
        .rail-chip {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; flex: 0 0 28px; padding: 0;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--panel); color: var(--muted);
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            cursor: pointer;
        }
        .rail-chip:hover { color: var(--accent); border-color: var(--accent); }
        .rail-chip.section-chip { background: var(--bg); color: var(--text); }
        .rail-chip.selected { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
        .rail-chip.drop-target { background: var(--accent); color: #fff; border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

        /* Section collapse chevron + drop highlight */
        .section-title { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; }
        .chevron { font-size: 9px; color: var(--muted); display: inline-block; transition: transform .18s ease; }
        /* The chevron points down when the section is open and turns as it folds shut. */
        .chevron.closed { transform: rotate(-90deg); }
        /* The open folder's way back to the grid, standing in for the chevron: sized and weighted like
           the header's other icons rather than the small arrow it replaces, so it reads as a way out and
           not as a fold-away toggle nobody would think to click. */
        .chevron.back { font-size: 15px; font-weight: 600; }
        .card-section-title:hover .chevron.back { color: var(--accent); }

        /* A section folds instead of blinking away: the content sits in a one-row grid whose row goes
           from 1fr to 0fr, so the height is animated without anything having to be measured first.
           The clipping that makes the fold look like one is lifted once the section stands open (see
           Collapsible.kt) — the grid inside would otherwise go on cutting the lift off a hovered card. */
        .collapsible { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .18s ease; }
        .collapsible.open { grid-template-rows: 1fr; }
        .collapsible-inner { overflow: hidden; min-height: 0; }
        .collapsible.settled > .collapsible-inner { overflow: visible; }
        @media (prefers-reduced-motion: reduce) {
            .collapsible, .chevron { transition: none; }
        }
        .section.drop-section { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 8px; }
        /* A section is dragged by its header, and fades while it is being carried somewhere else. */
        .section-head { cursor: grab; }
        .section-head:active { cursor: grabbing; }
        .section.dragging { opacity: .45; }

        /* Inline rename (double-click a section title). The field is stacked on a hidden copy of its
           own text in a one-cell grid, so it is exactly as wide as its content: nothing around it
           moves, neither when the edit opens nor as the name is typed. The underline marking the
           edit is a shadow rather than a border, for the same reason. */
        .inline-edit { display: inline-grid; align-items: center; min-width: 4ch; }
        .inline-edit > * { grid-area: 1 / 1; }
        .inline-edit-sizer { visibility: hidden; white-space: pre; padding-right: 1px; }
        .inline-edit-input { width: 100%; min-width: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--text); background: transparent; border: none; outline: none; padding: 0; margin: 0; cursor: text; user-select: text; box-shadow: 0 1px 0 var(--accent); }

        /* Top toolbar: the search box + the tabs toggle */
        .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

        /* The search box is one field over a dropdown of what it found: tabs, cards, history, the web,
           the model. The wrapper is the positioning context for the dropdown, which hangs over the
           content below rather than pushing it down. */
        .searchbox { position: relative; flex: 1; }
        .search-field { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 0 10px; }
        .search-field:focus-within { border-color: var(--accent); }
        .search { flex: 1; min-width: 0; border: none; background: transparent; color: var(--text); padding: 8px 2px; font-size: 14px; }
        .search:focus { outline: none; }

        .search-drop { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 34px rgba(0, 0, 0, .18); max-height: 70vh; overflow: auto; }
        .hit-group-label { padding: 6px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
        .hit-list { list-style: none; margin: 0; padding: 0; }
        .hit { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
        .hit.selected { background: var(--accent-soft); }
        .hit-icon, .hit-glyph { flex: 0 0 18px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .hit-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
        .hit-title { flex: 0 1 auto; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hit-sub { flex: 0 1 auto; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hit-action { flex: 0 0 auto; color: var(--muted); font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
        .hit-forget { opacity: 0; }
        .hit:hover .hit-forget, .hit.selected .hit-forget { opacity: 1; }
        .hit-hints { margin-top: 6px; padding: 6px 8px 2px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }

        /* Settings: the model that answers, named. */
        .ai-model { font-weight: 700; font-size: 13px; white-space: nowrap; }

        /* The conversation with the model: a window over the page. The exchanges scroll on their own,
           so the field the next question is typed in stays where it is. */
        .ai-modal { max-width: 720px; }
        .ai-title { display: flex; align-items: center; gap: 8px; }
        .ai-badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; }
        .ai-log { flex: 1; min-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; }
        .ai-download { padding: 10px 12px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; }
        .ai-turn { position: relative; min-width: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
        /* An address the model wrote out in full is longer than this window is wide: it wraps mid-word
           rather than pushing the conversation sideways. Code is the exception — it scrolls instead. */
        .ai-question, .ai-answer { min-width: 0; overflow-wrap: anywhere; }
        .ai-question { margin-bottom: 8px; padding-right: 52px; font-weight: 700; }
        .ai-thinking { color: var(--muted); }
        .ai-answer { line-height: 1.55; }
        .ai-answer p { margin: 0 0 8px; }
        .ai-answer pre { max-width: 100%; overflow-x: auto; }
        .ai-answer pre code { overflow-wrap: normal; white-space: pre; }
        .ai-answer img { max-width: 100%; }
        .ai-answer table { display: block; max-width: 100%; overflow-x: auto; }
        /* Copying the answer and keeping it as a note are the answer's own actions: its corner, on hover. */
        .ai-turn-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; opacity: 0; }
        .icon.ai-tool {
            border: none; background: transparent; color: var(--muted);
            cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px;
        }
        .ai-turn:hover .ai-turn-tools, .ai-turn-tools:focus-within { opacity: 1; }
        .icon.ai-tool:hover { color: var(--accent); }
        .ai-ask { justify-content: stretch; }
        .ai-input { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
        .ai-input:focus { outline: none; border-color: var(--accent); }
        .ai-input:disabled { opacity: .6; }

        /* The model's plan for a window of tabs, shown before any of it is done: the groups scroll on
           their own, so the button that carries it out stays where it is. Every row can be unticked or
           sent somewhere else — this window is the whole point of the feature, not a confirmation. */
        .triage-modal { max-width: 760px; }
        /* The shell (.modal) is already a column capped at 88vh, so this only has to take what is left
           and scroll it — as .ai-log does. A max-height of its own here would fight the shell's. */
        .triage-body { flex: 1; min-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; }
        /* flex: none on both — a column flex child shrinks before its parent scrolls, so without this
           a group of twenty tabs is squashed to a sliver instead of pushing the body into its scroll. */
        .triage-summary { flex: none; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; position: relative; }
        .triage-summary-head { margin-bottom: 6px; font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
        .triage-summary:hover .ai-turn-tools, .triage-summary .ai-turn-tools:focus-within { opacity: 1; }
        /* How far down the sites the run has got. A line rather than a spinner: the groups below fill
           in under it as each site lands, so there is always something to read while it works. */
        .triage-progress { flex: none; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; }
        /* The plan is drawn as the sidebar's own tree — section, collection, divider — so the three
           levels must read as depth, not as three kinds of identical box. The outermost carries the
           frame; the ones inside it are marked by indent and a rule running down the branch. */
        .triage-branch { flex: none; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .triage-branch-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
        .triage-branch-title { font-weight: 700; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .triage-branch-head .count { margin-left: auto; }
        /* A collection inside its section: no frame of its own, just the branch line and the indent. */
        .triage-group { flex: none; margin: 8px 8px 8px 14px; border-left: 2px solid var(--border); border-radius: 0; overflow: hidden; }
        .triage-group + .triage-group { margin-top: 10px; }
        .triage-group-head { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 10px; background: transparent; border-bottom: none; }
        .triage-group-title { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* A collection that does not exist yet: the one thing in a plan that unticking a row cannot
           take back, so it is marked rather than left to be discovered afterwards. */
        .triage-new { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 5px; }
        .triage-group-head .count { margin-left: auto; }
        /* The tabs the model had nothing to say about. Not an error — they are simply the user's to place. */
        .triage-unsorted { flex: none; margin: 0; border: 1px dashed var(--border); border-radius: 10px; overflow: hidden; }
        .triage-unsorted > .triage-group-head { padding: 9px 12px; background: var(--bg); border-bottom: 1px dashed var(--border); }
        .triage-tabs { list-style: none; margin: 0; padding: 2px 6px 6px 10px; display: flex; flex-direction: column; gap: 2px; }
        .triage-tab { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; }
        .triage-tab:hover { background: var(--bg); }
        /* Out of the plan, but still on screen: a row the user can see they are not saving, and tick back. */
        .triage-tab.skipped { opacity: .5; }
        .triage-pick { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; cursor: pointer; }
        .triage-tab-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .triage-dup { flex: none; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px; }
        /* Two pickers on a row — the collection, then the section within it — so both are narrow, and
           the title beside them keeps what is left. The section one is only there where the collection
           has dividers at all. */
        .triage-target { flex: none; max-width: 150px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
        .triage-target:focus { outline: none; border-color: var(--accent); }
        .triage-section-pick { max-width: 120px; color: var(--muted); }
        /* On a collection the plan would create: which sidebar section to create it in. It is the
           model's proposal until the user says otherwise, so it sits in the head, quiet and small. */
        .triage-group-pick { max-width: 130px; margin-left: 4px; color: var(--muted); font-size: 11px; }
        /* A divider inside a collection group: subordinate to the group head above it, and clearly not
           another group — it is indented, quieter, and carries no border of its own. */
        .triage-section-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 2px 22px; }
        .triage-section-title { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .triage-section-head .count { margin-left: auto; }
        .triage-section-head + .triage-tabs { padding-top: 0; }
        /* What is saved from this site already, said once per site: the reason a row may not be worth
           ticking. It reads as a footnote to the rows above it, not as one of them. */
        .triage-related { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 6px 6px 30px; color: var(--muted); font-size: 11px; }
        .triage-related-card { border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Editing a card: the title in a field and, for a link, its address behind a toggle. */
        .rename-modal { max-width: 560px; }
        .rename-url-toggle { align-self: flex-start; margin: 8px 18px; border: none; background: none; padding: 0; color: var(--muted); font-size: 12px; cursor: pointer; }
        .rename-url-toggle:hover { color: var(--accent); }
        .rename-url { margin: 4px 18px 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; }

        .control { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 7px 8px; font-size: 13px; cursor: pointer; }
        .control:hover { border-color: var(--accent); }
        .content-head .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* Card sections (dividers inside a collection) */
        .card-section-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .card-section-title { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-weight: 700; font-size: 13px; }
        .card-section-title .count { color: var(--muted); font-weight: 500; font-size: 12px; }
        .card-section-head .icon.del { opacity: 0; }
        .card-section-head:hover .icon.del, .card-section-head:focus-within .icon.del { opacity: 1; }

        /* A card group (the ungrouped area, or one card section) is the drop zone for cards and tabs:
           the whole block, header and grid alike, so the drop never has to hit the header strip.
           outline-color is deliberately not transitioned: it starts out as currentColor, so on the
           first paint the browser would animate a black dashed outline away over the transition. */
        .card-group { border-radius: 10px; padding: 4px 8px; margin: 0 -8px; outline: 2px dashed transparent; outline-offset: -2px; transition: background .12s; }
        .card-group.drop-active { outline-color: var(--accent); background: var(--accent-soft); }
        .card-group.drop-active .empty.small { color: var(--accent); }
        /* A card section is dragged by its header, and fades while it is being carried up or down. */
        .card-section-head[draggable="true"] { cursor: grab; }
        .card-section-head[draggable="true"]:active { cursor: grabbing; }
        .card-group.dragging { opacity: .45; }
        .card.dragging { opacity: .4; }

        /* Folder view (the "Sections view" setting): a collection's sections as a grid of closed
           folders, each opening out across the full row where it stands. Every rule here restyles the
           group the list view already draws — the same header, the same tools, the same drop zone (see
           [cardGroup]) — so a folder is not a second kind of section that could drift out of step with
           the first. What the click does is unchanged too: it sets the section's own `collapsed`. */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px; align-items: start; margin-top: 18px;
        }
        /* An open folder takes the whole row and is, from there down, an ordinary section. */
        .folder-grid > .card-group.folder.open { grid-column: 1 / -1; }
        .folder-grid > .card-group.folder.open > .card-section-head { margin-top: 2px; }
        /* A closed one is a tile — and the tile is the header, stood up. The group's own padding and
           negative margins are dropped: they would push it out of the grid cell it was given. */
        .card-group.folder:not(.open) { margin: 0; padding: 0; }
        .card-group.folder:not(.open) > .card-section-head {
            position: relative;
            flex-direction: column; align-items: flex-start; justify-content: flex-start;
            margin: 0; padding: 12px;
            border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
            box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
            transition: border-color .12s, transform .12s, box-shadow .12s;
        }
        .card-group.folder:not(.open) > .card-section-head:hover,
        .card-group.folder:not(.open) > .card-section-head:focus-within {
            border-color: var(--accent); transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 24, 40, .12);
        }
        /* The folder glyph stands in for the chevron: on a tile there is no row folded away above the
           cards, and the one thing a click does here is open the folder. The title wraps rather than
           ends in an ellipsis — a tile is wide enough for two words and a name cut short is a name. */
        .card-group.folder:not(.open) .chevron { display: none; }
        /* The icon sits above the title as a corner decoration ([::before], taken out of flow) rather
           than a flex item beside it, so the only two things left in flow — the name and its count —
           share a row instead of each standing alone on one: a lone number under the name is the tile
           looking half-finished, not a second fact about the folder. */
        .card-group.folder:not(.open) .card-section-title {
            flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 4px 6px;
            max-width: 100%; overflow-wrap: anywhere; padding-right: 20px; padding-top: 30px;
        }
        .card-group.folder:not(.open) .card-section-title::before {
            /* The same folder glyph as `icon("folder")` (see Icon.kt) — masked rather than drawn as an
               <img>, so it tints with the surrounding text colour like every other icon in the app
               instead of carrying its own baked-in colour. */
            content: "";
            position: absolute; top: 12px; left: 12px;
            width: 22px; height: 22px;
            background-color: var(--muted);
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6l2 2h8v10H4z"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6l2 2h8v10H4z"/></svg>');
            -webkit-mask-size: contain; mask-size: contain;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        }
        /* Out of the flow and into the corner, exactly as .card-tools sit on a card: in the column the
           title is in, they would take a row of their own and leave a gap under every closed folder. */
        .card-group.folder:not(.open) .card-section-tools { position: absolute; top: 6px; right: 6px; }
        /* An open tab drawn as a card ([TabCard]): the tab selected in its window, and the one a drag
           would land on. Mirrors .tab.current / .tab.drop-target — same states, card-shaped. */
        .card.current { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .card.drop-target { outline: 2px solid var(--accent); outline-offset: -1px; }

        /* Right sidebar header row */
        .tabs-head { display: flex; align-items: center; justify-content: space-between; }

        /* Card kinds: note/file glyphs + image thumbnails */
        .glyph { width: 24px; height: 24px; flex: 0 0 24px; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 5px; background: var(--bg); }
        .fav.thumb { object-fit: cover; }
        .card.kind-note { --card-accent: #f5c451; border-left: 3px solid var(--card-accent); }
        .card.kind-file { --card-accent: #7c9cf5; border-left: 3px solid var(--card-accent); }
        .card:hover .icon.edit:hover { color: var(--card-accent); }

        /* The hover menus of a card-section header: "+" adds a card, "⇅" sorts the section. Both drop a
           list of actions under a glyph, and like the header's other tools they stay out of the way
           until the section is hovered — or until one is tabbed to, or its own menu is open, which
           :focus-within covers both.

           The list is built from buttons, not from a native <select>: a select's options take almost no
           styling, so the ⇅ could never have been made to read like the "+" beside it. */
        .menu { position: relative; display: inline-block; }
        .card-section-head .menu { opacity: 0; transition: opacity .12s; }
        .card-section-head:hover .menu, .card-section-head:focus-within .menu { opacity: 1; }
        .icon.menu-btn { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
        .icon.menu-btn:hover { color: var(--accent); }
        .menu:hover .icon.menu-btn { color: var(--accent); }
        /* What holds the list off the glyph is the dropdown's own padding, not a margin: a strip of
           nothing between the two would close the menu the moment the pointer crossed it. The panel is
           one card behind the whole list, so the items read as a menu rather than as loose buttons. */
        .menu-dropdown {
            position: absolute; top: 100%; right: 0; z-index: 20; display: none;
            padding: 4px; min-width: 176px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.16);
        }
        .menu:hover .menu-dropdown, .menu:focus-within .menu-dropdown { display: block; }
        .menu-item {
            display: block; width: 100%; text-align: left;
            border: none; background: transparent; color: var(--text);
            padding: 7px 10px; border-radius: 7px; cursor: pointer;
            font-size: 13px; line-height: 1.3; white-space: nowrap;
        }
        .menu-item:hover { background: var(--accent-soft); color: var(--accent); }
        /* A heading over the sort actions: the ⇅ opens five ways of ordering the cards, and without a
           word over them the list is five sentences with nothing saying what they have in common. */
        .menu-title {
            padding: 6px 10px 4px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
        }

        /* Card-section tools + description */
        .card-section-tools { display: flex; align-items: center; gap: 2px; }
        .icon.edit { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; opacity: 0; }
        .card-section-head:hover .icon.edit, .card-section-head:focus-within .icon.edit { opacity: 1; }
        .icon.edit:hover { color: var(--accent); }
        /* Unlike edit/del, open-all reads rather than writes, so it shows on a read-only collection too. */
        .icon.open-all { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; opacity: 0; }
        .card-section-head:hover .icon.open-all, .card-section-head:focus-within .icon.open-all { opacity: 1; }
        .icon.open-all:hover { color: var(--accent); }
        .card-section-desc { margin: -2px 0 12px; color: var(--muted); font-size: 13px; }
        .card-section-desc p { margin: 4px 0; }
        .card-section-desc ul { margin: 4px 0; padding-left: 20px; }

        /* Shared rich-text styling for rendered markdown */
        .card-section-desc a, .note-preview a { color: var(--accent); }
        .card-section-desc mark, .note-preview mark { background: #ffe58a; color: #1c2024; padding: 0 2px; border-radius: 2px; }
        .card-section-desc code, .note-preview code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

        /* Modals */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
        .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: 100%; max-width: 820px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
        .file-modal { max-width: 640px; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
        .modal-head h3 { margin: 0; font-size: 16px; }
        .modal-head .icon.del { opacity: 1; position: static; }
        .modal-title-input { margin: 14px 18px 0; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 15px; font-weight: 600; }
        .note-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 18px; flex: 1; min-height: 320px; overflow: hidden; }
        .note-editor { resize: none; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
        .note-editor:focus { outline: none; border-color: var(--accent); }
        .note-preview { border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; background: var(--panel); }
        .note-preview h2 { font-size: 18px; margin: 8px 0; }
        .note-preview h3 { font-size: 16px; margin: 8px 0; }
        .note-preview h4 { font-size: 14px; margin: 6px 0; }
        .note-preview p { margin: 6px 0; }
        .note-preview ul { margin: 6px 0; padding-left: 20px; }
        .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { filter: brightness(1.05); color: #fff; }
        .btn:disabled { opacity: .5; cursor: default; }

        /* File modal */
        .file-picker { display: inline-block; margin: 16px 18px 0; border: 1px dashed var(--border); border-radius: 10px; padding: 14px 18px; cursor: pointer; color: var(--muted); text-align: center; }
        .file-picker:hover { border-color: var(--accent); color: var(--accent); }
        .hidden-file-input { display: none; }
        .file-preview { padding: 16px 18px; display: flex; justify-content: center; overflow: auto; }
        .preview-media { max-width: 100%; max-height: 60vh; border-radius: 8px; }

        @media (max-width: 680px) { .note-split { grid-template-columns: 1fr; } }


        /* The strip saying the text on screen is an unsaved draft put back, not the saved note. */
        .draft-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 18px -2px; padding: 7px 11px; border: 1px solid #f5c451; border-radius: 8px; background: rgba(245, 196, 81, 0.12); font-size: 12px; color: var(--text); }
        .draft-discard { border: none; background: none; padding: 0; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; }
        .draft-discard:hover { text-decoration: underline; }

        /* WYSIWYG note editor */
        .wysiwyg-toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 18px 0; }
        .tool { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 7px; padding: 5px 9px; font-size: 13px; cursor: pointer; min-width: 30px; }
        .tool:hover { border-color: var(--accent); color: var(--accent); }
        .wysiwyg { margin: 12px 18px; flex: 1; min-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--bg); font-size: 14px; line-height: 1.6; }
        .wysiwyg:focus { outline: none; border-color: var(--accent); }
        .wysiwyg:empty::before { content: attr(data-placeholder); color: var(--muted); }
        /* A note being read: a page, not a field — and an empty one prompts nobody to write in it. */
        .wysiwyg.reading { background: var(--panel); }
        .wysiwyg.reading:empty::before { content: ""; }
        .wysiwyg h2 { font-size: 18px; margin: 8px 0; }
        .wysiwyg h3 { font-size: 16px; margin: 8px 0; }
        .wysiwyg p { margin: 6px 0; }
        .wysiwyg ul { margin: 6px 0; padding-left: 22px; }
        .wysiwyg a { color: var(--accent); }
        .wysiwyg mark { background: #ffe58a; color: #1c2024; padding: 0 2px; border-radius: 2px; }
        .wysiwyg code { background: var(--panel); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

        /* Left-sidebar footer: settings entry pinned to the bottom */
        .sidebar-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
        .settings-btn { width: 100%; text-align: left; display: flex; align-items: center; gap: 6px; }
        .settings-btn .gear { font-size: 15px; line-height: 1; }
        .settings-rail { margin-top: auto; }

        /* The section PIN lock: the glyph and menu in the sidebar, the screen that stands in for a
           locked section, and the modal where its PIN is set. A locked section shows its name and its
           padlock and nothing else — no collections, no controls. */
        .section-head .icon.lock { opacity: 0; font-size: 13px; }
        .section-head:hover .icon.lock, .section-head:focus-within .icon.lock { opacity: 1; }
        .section.locked .section-title { cursor: pointer; color: var(--muted); }
        .section.locked .chevron { font-size: 12px; }
        /* The collection's read-only badge, next to its name in the header. */
        .ro-badge { margin-left: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; vertical-align: middle; }
        .lock-action { width: 220px; }
        .lock-action.danger { color: var(--danger); border-color: var(--border); }
        .lock-action.danger:hover { border-color: var(--danger); color: var(--danger); }
        .lock-screen { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 340px; margin: 80px auto; text-align: center; }
        .lock-icon { font-size: 38px; line-height: 1; }
        .lock-title { font-size: 18px; font-weight: 700; }
        .lock-hint { color: var(--muted); font-size: 13px; margin: 0; }
        .pin-input { width: 220px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 16px; text-align: center; letter-spacing: .3em; }
        .pin-input:focus { outline: none; border-color: var(--accent); }
        .pin-input::placeholder { letter-spacing: normal; }
        .pin-error { color: var(--danger); font-size: 13px; min-height: 18px; }
        .pin-modal { max-width: 420px; }
        .pin-body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px; }

        /* The undo toast: what was just deleted, and the way back from it, over the page for 30 seconds. */
        .undo-toast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200;
            display: flex; align-items: center; gap: 12px;
            background: var(--panel); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,.35); padding: 10px 12px 10px 16px;
        }
        .undo-msg { font-size: 13px; }
        .btn.undo-btn { padding: 5px 10px; font-size: 13px; color: var(--accent); border-color: var(--accent); }
        .icon.del.undo-dismiss { opacity: .7; position: static; }
        .icon.del.undo-dismiss:hover { opacity: 1; }

        /* Settings modal — a left rail names the panes; only the chosen one is drawn on the right. */
        .settings-modal { max-width: 880px; }
        .settings-layout { display: flex; flex: 1; min-height: 0; }
        .settings-nav { flex: 0 0 208px; border-right: 1px solid var(--border); padding: 12px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .settings-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: transparent; color: var(--text); padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .settings-nav-item:hover { background: var(--bg); }
        .settings-nav-item.active { background: var(--accent); color: #fff; }
        .settings-nav-icon { font-size: 15px; width: 20px; text-align: center; flex: 0 0 auto; }
        .settings-body { flex: 1; min-width: 0; padding: 6px 20px 8px; overflow-y: auto; }
        .settings-section { padding: 14px 0; border-bottom: 1px solid var(--border); }
        .settings-section:last-child { border-bottom: none; }
        .settings-section h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
        .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
        .settings-row + .settings-row { margin-top: 14px; }
        .settings-label { display: flex; flex-direction: column; gap: 2px; flex: 1 1 220px; min-width: 0; }
        .settings-title { font-weight: 600; }
        .settings-hint { color: var(--muted); font-size: 12px; margin: 0; }
        /* On a setting that turns on something unfinished. Beside the name, not inside the hint: it is
           part of what the switch is, and the hint is where the reading stops. */
        .settings-badge { margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; vertical-align: 2px; }
        .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .theme-toggle { display: inline-flex; flex: 0 0 auto; max-width: 100%; margin-left: auto; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .theme-opt { border: none; background: var(--panel); color: var(--text); padding: 7px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; border-left: 1px solid var(--border); }
        .theme-opt:first-child { border-left: none; }
        .theme-opt:hover { color: var(--accent); }
        .theme-opt.active { background: var(--accent); color: #fff; }
        .theme-opt:disabled { opacity: .45; cursor: default; }
        .theme-opt:disabled:hover { color: var(--text); }
        /* Accent-color picker: a row of round swatches, one per preset, in the preset's own light-mode
           colour — so the choice reads the same regardless of which theme is active while picking it. */
        .accent-swatches { display: inline-flex; flex: 0 0 auto; gap: 8px; margin-left: auto; }
        .accent-swatch {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0;
            cursor: pointer;
        }
        .accent-swatch:hover { transform: scale(1.1); }
        .accent-swatch.active { border-color: var(--text); }
        .accent-swatch-blue { background: #3b82f6; }
        .accent-swatch-purple { background: #8b5cf6; }
        .accent-swatch-green { background: #16a34a; }
        .accent-swatch-orange { background: #ea580c; }
        .accent-swatch-rose { background: #e11d48; }
        /* Too narrow for a side rail (a small extension popup, a phone): the nav lies down into a
           horizontal strip that scrolls, and the pane takes the full width beneath it. */
        @media (max-width: 620px) {
            .settings-layout { flex-direction: column; }
            .settings-nav { flex: 0 0 auto; flex-direction: row; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; padding: 8px 10px; }
            .settings-nav-item { width: auto; flex: 0 0 auto; }
        }


        /* ---- Account and sync ---------------------------------------------------------------- */
        .account-modal { width: min(420px, 92vw); }
        .account-modal p { margin: 12px 18px; font-size: 13px; }
        .account-modal p.muted { color: var(--muted, #8b949e); }
        .account-modal p.error { color: var(--danger, #f85149); }
        .account-modal .btn.danger { margin: 0 18px 16px; color: var(--danger, #f85149); }
        .account-modal .btn.google { display: block; width: calc(100% - 36px); margin: 14px 18px 18px;
            padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
            color: var(--fg); cursor: pointer; font-size: 14px; }
        .account-modal .btn.google:hover { background: var(--bg); }
        .account-modal .row { display: flex; gap: 8px; padding: 12px 18px; }

        /* ---- About (a settings pane) ------------------------------------------------------------ */
        .about-pane { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-top: 8px; }
        .about-pane .brand-logo { width: 56px; height: 56px; border-radius: 12px; margin: 4px 0; }
        .about-name { font-size: 18px; font-weight: 600; color: #50219B; }
        .about-version, .about-copyright { font-size: 13px; color: var(--muted, #8b949e); }
        .about-link { font-size: 13px; color: var(--accent); margin-top: 6px; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="application/javascript" src="stramus.js"></script>
</body>
</html>
