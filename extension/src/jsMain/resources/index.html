<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stramus</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --border: #e6e8eb;
            --text: #1c2024;
            --muted: #6b7280;
            --accent: #3b82f6;
            --accent-soft: #eaf1fe;
            --danger: #ef4444;
        }
        /* Dark palette, shared by the OS "auto" default and the explicit night theme. */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16181d;
                --panel: #1e2127;
                --border: #2b2f36;
                --text: #e7e9ea;
                --muted: #9aa1ab;
                --accent: #4b8bf5;
                --accent-soft: #22304d;
                --danger: #f26060;
            }
        }
        /* Explicit theme choice from the toolbar wins over the OS preference. */
        :root[data-theme="dark"] {
            --bg: #16181d;
            --panel: #1e2127;
            --border: #2b2f36;
            --text: #e7e9ea;
            --muted: #9aa1ab;
            --accent: #4b8bf5;
            --accent-soft: #22304d;
            --danger: #f26060;
        }
        :root[data-theme="light"] {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --border: #e6e8eb;
            --text: #1c2024;
            --muted: #6b7280;
            --accent: #3b82f6;
            --accent-soft: #eaf1fe;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        #root, .app { height: 100vh; }
        .app { display: flex; }

        .sidebar {
            width: 260px;
            flex: 0 0 260px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            gap: 10px;
            overflow-y: auto;
        }
        .brand { font-size: 18px; font-weight: 700; padding: 4px 8px; letter-spacing: 0.2px; }

        .btn {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .new-col { text-align: left; }

        .sidebar > .section { display: flex; flex-direction: column; gap: 2px; }
        .section-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px 2px; }
        .section-title { flex: 1; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .section-head .icon { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
        .section-head .icon:hover { color: var(--accent); }
        .section-head .icon.del:hover { color: var(--danger); }
        .collections { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
        .col {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; border-radius: 8px; cursor: pointer;
        }
        .col:hover { background: var(--bg); }
        .col.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
        .col.drop-target { background: var(--accent); color: #fff; outline: 2px solid var(--accent); outline-offset: 1px; }
        .col.drop-target .icon.del { color: #fff; }
        .col-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .icon.del {
            border: none; background: transparent; color: var(--muted);
            cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; opacity: 0;
        }
        .col:hover .icon.del, .card:hover .icon.del { opacity: 1; }
        .icon.del:hover { color: var(--danger); }

        .content { flex: 1; padding: 24px 28px; overflow-y: auto; }
        .content.drop-active { outline: 3px dashed var(--accent); outline-offset: -10px; background: var(--accent-soft); }
        .content-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .content-head h2 { margin: 0; font-size: 20px; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .card {
            position: relative;
            display: flex; align-items: center; gap: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: border-color .12s, transform .12s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-1px); }
        .fav { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 5px; background: var(--bg); }
        .card-body { min-width: 0; flex: 1; }
        .card-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-url { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card .icon.del { position: absolute; top: 6px; right: 8px; }

        /* Right sidebar: live open-tabs list (extension only) */
        .tabs {
            width: 280px; flex: 0 0 280px;
            background: var(--panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 16px 12px; gap: 8px;
        }
        .tabs-head { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 4px 8px; }
        .tab-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .tab {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 8px; cursor: grab;
            border: 1px solid transparent;
        }
        .tab:hover { background: var(--bg); border-color: var(--border); }
        .tab:active { cursor: grabbing; }
        .tab .fav { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 4px; background: var(--bg); }
        .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .empty.small { padding: 16px 8px; font-size: 13px; text-align: left; }

        /* Brand row + sidebar collapse controls */
        .brand { display: flex; align-items: center; justify-content: space-between; }
        .icon.collapse-btn { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; opacity: .7; }
        .icon.collapse-btn:hover { color: var(--accent); opacity: 1; }
        .sidebar.collapsed, .tabs.collapsed { width: 40px; flex: 0 0 40px; padding: 12px 5px; align-items: center; }
        .rail-toggle { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 8px; cursor: pointer; padding: 8px 4px; width: 100%; }
        .rail-toggle:hover { color: var(--accent); border-color: var(--accent); }

        /* Section collapse chevron + drop highlight */
        .section-title { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; }
        .chevron { font-size: 9px; color: var(--muted); }
        .section.drop-section { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 8px; }

        /* Top toolbar: search + theme/sort/export controls */
        .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .search { flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
        .search:focus { outline: none; border-color: var(--accent); }
        .toolbar { display: flex; align-items: center; gap: 8px; }
        .control { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 7px 8px; font-size: 13px; cursor: pointer; }
        .control:hover { border-color: var(--accent); }
        .content-head .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* Card sections (dividers inside a collection) */
        .card-section-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .card-section-title { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-weight: 700; font-size: 13px; }
        .card-section-title .count { color: var(--muted); font-weight: 500; font-size: 12px; }
        .card-section-head .icon.del { opacity: 0; }
        .card-section-head:hover .icon.del { opacity: 1; }

        /* Right sidebar header row */
        .tabs-head { display: flex; align-items: center; justify-content: space-between; }

        /* Card kinds: note/file glyphs + image thumbnails */
        .glyph { width: 24px; height: 24px; flex: 0 0 24px; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 5px; background: var(--bg); }
        .fav.thumb { object-fit: cover; }
        .card.kind-note { border-left: 3px solid #f5c451; }
        .card.kind-file { border-left: 3px solid #7c9cf5; }

        /* "Add link" hover menu */
        .add-menu { position: relative; display: inline-block; }
        .add-dropdown { position: absolute; top: 100%; right: 0; padding: 6px 4px 4px; display: none; z-index: 20; min-width: 150px; }
        .add-menu:hover .add-dropdown { display: block; }
        .add-dropdown > * + * { margin-top: 2px; }
        .add-dropdown { background: transparent; }
        .add-item { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
        .add-item:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

        /* Card-section tools + description */
        .card-section-tools { display: flex; align-items: center; gap: 2px; }
        .icon.edit { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; opacity: 0; }
        .card-section-head:hover .icon.edit { opacity: 1; }
        .icon.edit:hover { color: var(--accent); }
        .card-section-desc { margin: -2px 0 12px; color: var(--muted); font-size: 13px; }
        .card-section-desc p { margin: 4px 0; }
        .card-section-desc ul { margin: 4px 0; padding-left: 20px; }

        /* Shared rich-text styling for rendered markdown */
        .card-section-desc a, .note-preview a { color: var(--accent); }
        .card-section-desc mark, .note-preview mark { background: #ffe58a; color: #1c2024; padding: 0 2px; border-radius: 2px; }
        .card-section-desc code, .note-preview code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

        /* Modals */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
        .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: 100%; max-width: 820px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
        .file-modal { max-width: 640px; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
        .modal-head h3 { margin: 0; font-size: 16px; }
        .modal-head .icon.del { opacity: 1; position: static; }
        .modal-title-input { margin: 14px 18px 0; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 15px; font-weight: 600; }
        .note-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 18px; flex: 1; min-height: 320px; overflow: hidden; }
        .note-editor { resize: none; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
        .note-editor:focus { outline: none; border-color: var(--accent); }
        .note-preview { border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; background: var(--panel); }
        .note-preview h2 { font-size: 18px; margin: 8px 0; }
        .note-preview h3 { font-size: 16px; margin: 8px 0; }
        .note-preview h4 { font-size: 14px; margin: 6px 0; }
        .note-preview p { margin: 6px 0; }
        .note-preview ul { margin: 6px 0; padding-left: 20px; }
        .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { filter: brightness(1.05); color: #fff; }
        .btn:disabled { opacity: .5; cursor: default; }

        /* File modal */
        .file-picker { display: inline-block; margin: 16px 18px 0; border: 1px dashed var(--border); border-radius: 10px; padding: 14px 18px; cursor: pointer; color: var(--muted); text-align: center; }
        .file-picker:hover { border-color: var(--accent); color: var(--accent); }
        .hidden-file-input { display: none; }
        .file-preview { padding: 16px 18px; display: flex; justify-content: center; overflow: auto; }
        .preview-media { max-width: 100%; max-height: 60vh; border-radius: 8px; }

        @media (max-width: 680px) { .note-split { grid-template-columns: 1fr; } }


        /* WYSIWYG note editor */
        .wysiwyg-toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 18px 0; }
        .tool { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 7px; padding: 5px 9px; font-size: 13px; cursor: pointer; min-width: 30px; }
        .tool:hover { border-color: var(--accent); color: var(--accent); }
        .wysiwyg { margin: 12px 18px; flex: 1; min-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--bg); font-size: 14px; line-height: 1.6; }
        .wysiwyg:focus { outline: none; border-color: var(--accent); }
        .wysiwyg:empty::before { content: "Start writing…"; color: var(--muted); }
        .wysiwyg h2 { font-size: 18px; margin: 8px 0; }
        .wysiwyg h3 { font-size: 16px; margin: 8px 0; }
        .wysiwyg p { margin: 6px 0; }
        .wysiwyg ul { margin: 6px 0; padding-left: 22px; }
        .wysiwyg a { color: var(--accent); }
        .wysiwyg mark { background: #ffe58a; color: #1c2024; padding: 0 2px; border-radius: 2px; }
        .wysiwyg code { background: var(--panel); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

        /* Left-sidebar footer: settings entry pinned to the bottom */
        .sidebar-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
        .settings-btn { width: 100%; text-align: left; display: flex; align-items: center; gap: 6px; }
        .settings-btn .gear { font-size: 15px; line-height: 1; }
        .settings-rail { margin-top: auto; }

        /* Settings modal */
        .settings-modal { max-width: 560px; }
        .settings-body { padding: 6px 18px 4px; overflow-y: auto; }
        .settings-section { padding: 14px 0; border-bottom: 1px solid var(--border); }
        .settings-section:last-child { border-bottom: none; }
        .settings-section h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
        .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .settings-label { display: flex; flex-direction: column; gap: 2px; }
        .settings-title { font-weight: 600; }
        .settings-hint { color: var(--muted); font-size: 12px; margin: 0; }
        .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .theme-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .theme-opt { border: none; background: var(--panel); color: var(--text); padding: 7px 12px; cursor: pointer; font-size: 13px; border-left: 1px solid var(--border); }
        .theme-opt:first-child { border-left: none; }
        .theme-opt:hover { color: var(--accent); }
        .theme-opt.active { background: var(--accent); color: #fff; }

    </style>
</head>
<body>
<div id="root"></div>
<script type="application/javascript" src="stramus.js"></script>
</body>
</html>
